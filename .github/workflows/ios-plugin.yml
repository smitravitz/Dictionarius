name: iOS plugin

# There's no iOS app project yet; this keeps the Swift half of plugins/haptic-tick
# from rotting until there is. It needs a macOS runner, which GitHub sometimes can't
# supply for a while (capacity), so it runs only when the plugin's Swift side changes,
# not on every commit.
on:
  push:
    branches: [main]
    paths: &swift
      - plugins/haptic-tick/ios/**
      - plugins/haptic-tick/Package.swift
      - plugins/haptic-tick/*.podspec
      - .github/workflows/ios-plugin.yml
  pull_request:
    paths: *swift
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-plugin-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash # -eo pipefail, so xcodebuild's failure isn't hidden behind `tail`

jobs:
  ios-plugin:
    name: iOS haptic plugin compiles (Swift)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: List what the Swift package builds
        working-directory: plugins/haptic-tick
        run: xcodebuild -list
      - name: Build it for the iOS simulator
        working-directory: plugins/haptic-tick
        run: |
          xcodebuild build -scheme DictionariusHapticTick \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation | tail -25
