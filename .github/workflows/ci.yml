name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash # -eo pipefail, so a failing step can't hide behind `tee`

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Browser tests (Playwright, desktop + phone)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Playwright's own image ships the browsers, so nothing is downloaded at
    # test time (`playwright install` hung on the runner). Keep the tag in step
    # with @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
      # The web app as published (a production build, as pages.yml makes it): offline use.
      - run: npm run test:e2e:built
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-report-built/
          retention-days: 7

  android:
    name: Android app builds
    runs-on: ubuntu-24.04 # comes with the Android SDK
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: Build the web app (with the small sample word list)
        run: npm run build
        env:
          DICTIONARIUS_PUBLIC: ../test/fixtures
      - run: npx cap sync android
      - name: Build a debug APK and run the Java unit tests
        working-directory: android
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon
      # RangedAssets reads a block of the definitions where it lies in the APK, which
      # only works for files stored as they are (noCompress in build.gradle).
      - name: Check the definitions are stored uncompressed (read in place)
        run: |
          listing=$(unzip -v android/app/build/outputs/apk/debug/app-debug.apk)
          for kind in definitions examples etymology pronunciation; do
            line=$(grep -E "assets/public/[^ ]*\.$kind\.bin$" <<< "$listing")
            echo "$line"
            if [[ "$line" != *" Stored "* ]]; then
              echo "::error::the $kind file is compressed in the APK, so it can't be read in place"
              exit 1
            fi
          done
      - name: Check the APK against the privacy budget (privacy.toml)
        run: python3 scripts/audit_privacy.py --apk android/app/build/outputs/apk/debug/app-debug.apk

  bench:
    name: Benchmark (FM-index vs SQLite FTS5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            bench/requirements.txt
            scripts/requirements.txt
      - run: pip install -r bench/requirements.txt -r scripts/requirements.txt
      - name: Builder, privacy-audit and chat-trace unit tests
        run: python -m unittest scripts/test_build_fm_index.py scripts/test_definitions.py scripts/test_audit_privacy.py scripts/test_chat_traces.py
      - run: bash bench/fetch_data.sh words
      - name: Build headword index (self-verifying)
        run: |
          {
            echo '### Headword index build'
            echo '```'
            python scripts/build_fm_index.py bench/data/words_alpha.txt --out dist/headwords
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: FM-index (correctness + latency + size)
        run: |
          {
            echo '### FM-index'
            echo '```'
            python bench/fmbench.py
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: SQLite FTS5 trigram baseline
        run: |
          {
            echo '### SQLite FTS5 trigram baseline'
            echo '```'
            python bench/trigram.py
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
