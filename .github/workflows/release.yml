name: Release

# Pushing a tag like v1.2.3 builds a signed Android APK and publishes it as a
# GitHub release (which Obtainium picks up), keeps the same build as an app bundle for
# Google Play (this run's "play-app-bundle" artifact; docs/stores.md), then puts the same
# version's web app on GitHub Pages (pages.yml; only the latest release is online).
# The iOS app is built from the same tag by ios-release.yml.
# One-time setup: scripts/setup-release.sh, and Settings > Pages > Source: GitHub Actions.
# Release notes come from the tag's message: git tag -a v1.2.3 -m "What's new"
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  android:
    name: Signed Android APK
    runs-on: ubuntu-24.04 # comes with the Android SDK
    timeout-minutes: 40
    permissions:
      contents: write # to create the release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci

      - name: Work out the version from the tag
        id: version
        run: |
          # v1.2.3 -> versionName 1.2.3, versionCode 10203 (must grow with every release)
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]{1,2})\.([0-9]{1,2})$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME isn't in the form v1.2.3"
            exit 1
          fi
          major=${BASH_REMATCH[1]}
          minor=${BASH_REMATCH[2]}
          patch=${BASH_REMATCH[3]}
          echo "name=$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/release-data
        with:
          token: ${{ github.token }}

      # The APK must never ship data its own code can't open (a format it doesn't
      # read, another word list, a layer left behind): its word pages would be empty.
      - name: Check the data opens with this version's code
        run: npx vitest run test/definitions.test.ts
        env:
          DICTIONARIUS_RELEASE_DATA: release-data

      # Words picked at random from the real data, each opened in a real browser, must
      # show every part of their page, in a browser and as the app reads them (in place).
      - name: Install a browser for the word page check
        run: npx playwright install --with-deps chromium
      - name: Check randomly picked words show their whole page
        run: npx playwright test e2e/word-page-sample.spec.ts --project phone
        env:
          DICTIONARIUS_SAMPLE_DATA: release-data
          SAMPLE_SIZE: "40"

      # On a slow, lossy or dead connection, every part of a word's page (word classes and
      # meanings, examples, origin, pronunciation) arrives together, never one late, and the
      # page never waits for good: checked frame by frame, for each file on its own, on the
      # real word list (e2e/word-page-network.spec.ts). No release, and so no Pages deploy,
      # without it.
      - name: Check every part of a word's page arrives at once, on a bad connection
        run: npx playwright test e2e/word-page-network.spec.ts --project phone
        env:
          DICTIONARIUS_SAMPLE_DATA: release-data

      # The first-run tour on the real word list: each step shown and asked for, in order,
      # and nothing the tour acts out left behind (e2e/tour.spec.ts, its @release tests).
      - name: Check the first-run tour on the real word list
        run: npx playwright test e2e/tour.spec.ts --project phone --grep @release
        env:
          DICTIONARIUS_SAMPLE_DATA: release-data

      - name: Build the web app
        run: npm run build
        env:
          DICTIONARIUS_PUBLIC: ../release-data

      - run: npx cap sync android

      - name: Build and sign the APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::The signing key isn't set up. Run scripts/setup-release.sh once."
            exit 1
          fi
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.p12"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          ./gradlew assembleRelease --no-daemon \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PversionName=${{ steps.version.outputs.name }}
          rm "$ANDROID_KEYSTORE_PATH"

      - name: Check the signature
        id: apk
        run: |
          built=android/app/build/outputs/apk/release/app-release.apk
          apk="dictionarius-$GITHUB_REF_NAME.apk"
          cp "$built" "$apk"
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$build_tools/apksigner" verify --print-certs "$apk" | tee signature.txt
          {
            echo "file=$apk"
            echo "size=$(du -h "$apk" | cut -f1)"
            echo "sha256=$(sha256sum "$apk" | cut -d' ' -f1)"
            echo "cert=$(grep -m1 'certificate SHA-256 digest' signature.txt | awk '{print $NF}')"
          } >> "$GITHUB_OUTPUT"

      - name: Check the APK against the privacy budget (privacy.toml)
        run: python3 scripts/audit_privacy.py --apk "${{ steps.apk.outputs.file }}"

      # For Google Play, which takes an app bundle (.aab), not an APK (docs/stores.md): the
      # same build, signed with the same key (Play calls it the upload key), with the
      # definitions left uncompressed in the APKs Play makes from it. A step of its own that
      # may fail without stopping the release: the APK goes out exactly as it did before.
      - name: Build, sign and check the app bundle for Google Play
        id: bundle
        continue-on-error: true
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.p12"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          (cd android && ./gradlew bundleRelease --no-daemon \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PversionName=${{ steps.version.outputs.name }})
          rm "$ANDROID_KEYSTORE_PATH"
          bundle="dictionarius-$GITHUB_REF_NAME.aab"
          cp android/app/build/outputs/bundle/release/app-release.aab "$bundle"
          jarsigner -verify "$bundle" | tee bundle-signature.txt
          grep -q "jar verified" bundle-signature.txt
          bash scripts/check-bundle.sh "$bundle"
          echo "file=$bundle" >> "$GITHUB_OUTPUT"
      # Kept with this run, not on the release: Obtainium and people take the APK from there.
      - name: Keep the app bundle for uploading to Google Play
        if: steps.bundle.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: play-app-bundle
          path: ${{ steps.bundle.outputs.file }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # What's new: the tag's own message, when it was made with `git tag -a` (checkout
          # leaves the tag object behind, so fetch it). A plain `git tag` gets no notes.
          git fetch --quiet --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          : > notes.md
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ]; then
            git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$GITHUB_REF_NAME" > notes.md
            printf '\n---\n\n' >> notes.md
          fi
          cat >> notes.md <<EOF
          Android app, ${{ steps.apk.outputs.size }}. Install it directly, or add this repository to [Obtainium](https://obtainium.imranr.dev) to get updates.

          - APK SHA-256: \`${{ steps.apk.outputs.sha256 }}\`
          - Signing certificate SHA-256: \`${{ steps.apk.outputs.cert }}\`

          Words from [Wiktionary](https://en.wiktionary.org), [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/).
          EOF
          gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.file }}" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Dictionarius $GITHUB_REF_NAME" --notes-file notes.md

  # GitHub Pages only takes deploys from main (the github-pages environment's rule), not
  # from a tag, so this asks pages.yml to run on main and publish this release.
  pages:
    name: Web app on GitHub Pages
    needs: android # only a release that built, passed its checks and was published
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # to start pages.yml
    steps:
      - name: Publish ${{ github.ref_name }} on Pages (pages.yml, run from main)
        env:
          GH_TOKEN: ${{ github.token }}
          tag: ${{ github.ref_name }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$tag"
