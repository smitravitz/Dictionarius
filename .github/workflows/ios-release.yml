name: iOS release

# Pushing a tag like v1.2.3 builds the iOS app, signs it and uploads it to App Store Connect,
# where it shows up under TestFlight; submitting it for review is done there, by hand
# (docs/stores.md). Until the Apple secrets below are set it does nothing, so a release
# without an Apple account still goes out as before.
#
# Secrets (Settings > Secrets and variables > Actions), from App Store Connect > Users and
# Access > Integrations > App Store Connect API (a team key with the Admin role, which
# signing in the cloud needs):
#   APP_STORE_CONNECT_KEY_ID      the key's ID
#   APP_STORE_CONNECT_ISSUER_ID   the issuer ID above the list of keys
#   APP_STORE_CONNECT_KEY_BASE64  the downloaded .p8 file: base64 -w0 AuthKey_XXXX.p8
#   APPLE_TEAM_ID                 the team ID (developer.apple.com > Membership details)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The release to build (a tag such as v1.2.3)
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ios:
    name: iOS app to App Store Connect
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Is the Apple account set up?
        id: apple
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::No App Store Connect key in this repository's secrets, so no iOS build. See docs/stores.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.apple.outputs.ready == 'true'
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        if: steps.apple.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.apple.outputs.ready == 'true'

      - name: Work out the version from the tag
        if: steps.apple.outputs.ready == 'true'
        id: version
        run: |
          # The same numbers as the Android app (release.yml): v1.2.3 -> 1.2.3, build 10203.
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]{1,2})\.([0-9]{1,2})$ ]]; then
            echo "::error::Tag $TAG isn't in the form v1.2.3"
            exit 1
          fi
          major=${BASH_REMATCH[1]}
          minor=${BASH_REMATCH[2]}
          patch=${BASH_REMATCH[3]}
          echo "name=$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/release-data
        if: steps.apple.outputs.ready == 'true'
        with:
          token: ${{ github.token }}

      # As for the APK: never ship data this version's code can't open.
      - name: Check the data opens with this version's code
        if: steps.apple.outputs.ready == 'true'
        run: npx vitest run test/definitions.test.ts
        env:
          DICTIONARIUS_RELEASE_DATA: release-data

      - name: Build the web app
        if: steps.apple.outputs.ready == 'true'
        run: npm run build
        env:
          DICTIONARIUS_PUBLIC: ../release-data
      - run: npx cap sync ios
        if: steps.apple.outputs.ready == 'true'

      - name: Check the app against the privacy budget (privacy.toml)
        if: steps.apple.outputs.ready == 'true'
        run: python3 scripts/audit_privacy.py

      - name: Build, sign and upload to App Store Connect
        if: steps.apple.outputs.ready == 'true'
        working-directory: ios/App
        env:
          KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -version
          key="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          echo "$KEY_BASE64" | base64 --decode > "$key"
          # The key lets Xcode make the signing certificate and profile itself, in Apple's
          # cloud: nothing to create, export or renew by hand, and no Mac of your own.
          sign=(-allowProvisioningUpdates -authenticationKeyPath "$key"
                -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID")

          xcodebuild archive -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Dictionarius.xcarchive" \
            -skipPackagePluginValidation "${sign[@]}" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION=${{ steps.version.outputs.name }} \
            CURRENT_PROJECT_VERSION=${{ steps.version.outputs.code }} | tail -40

          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Dictionarius.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            "${sign[@]}" | tail -40
          rm "$key"
          echo "::notice::Dictionarius ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }}) is uploaded: App Store Connect > TestFlight, once Apple has processed it."
