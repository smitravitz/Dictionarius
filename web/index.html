<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Offline by construction: the page may load and request only its own files (privacy.toml
      allows no servers). Links the user taps still open, in the browser.
      style-src allows inline styles because Vite injects CSS that way while developing.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="An offline, open-source English dictionary that finds words from any part of them." />
    <meta name="theme-color" content="#f3f5f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1420" media="(prefers-color-scheme: dark)" />
    <title>Dictionarius</title>
  </head>
  <body>
    <main class="app">
      <header class="masthead">
        <h1 class="wordmark">Dictionarius</h1>
        <div class="masthead-end">
          <p class="status" id="status">Loading the word list…</p>
          <button class="cog" id="settings-open" type="button" aria-label="Settings" aria-haspopup="dialog" aria-controls="settings">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
              <path d="M10.3 2.75h3.4l.55 2.6c.68.25 1.31.61 1.87 1.07l2.52-.84 1.7 2.94-1.98 1.77a7.2 7.2 0 0 1 0 2.16l1.98 1.77-1.7 2.94-2.52-.84a7.2 7.2 0 0 1-1.87 1.07l-.55 2.6h-3.4l-.55-2.6a7.2 7.2 0 0 1-1.87-1.07l-2.52.84-1.7-2.94 1.98-1.77a7.2 7.2 0 0 1 0-2.16L3.86 8.52l1.7-2.94 2.52.84a7.2 7.2 0 0 1 1.87-1.07z" />
              <circle cx="12" cy="12" r="2.9" />
            </svg>
          </button>
        </div>
      </header>

      <div class="search">
        <label class="visually-hidden" for="q">Find a word</label>
        <input
          id="q"
          type="search"
          role="combobox"
          aria-autocomplete="list"
          aria-expanded="false"
          aria-controls="results"
          autocomplete="off"
          autocapitalize="none"
          autocorrect="off"
          spellcheck="false"
          enterkeyhint="search"
          placeholder="Search for a pattern..."
        />
        <!-- Under the cog: the Filters panel (word length wheels). Shown once the index says it can. -->
        <button class="cog funnel" id="filters-open" type="button" aria-label="Filters" aria-haspopup="dialog" aria-controls="filters" hidden>
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
            <path d="M4 5.25h16l-6.25 7.5v5.5l-3.5 1.75v-7.25z" />
          </svg>
        </button>
      </div>
      <p class="summary" id="summary" aria-live="polite"></p>
      <p class="hint" id="hint" hidden>Hold a blank spot in the list, then slide sideways to choose how many letters come before.</p>

      <section class="intro" id="intro">
        <p id="examples-label">Find every word containing:</p>
        <ul class="examples" id="examples" aria-labelledby="examples-label"></ul>
      </section>

      <div class="frame" id="frame" hidden>
        <div class="seam" aria-hidden="true"></div>
        <div class="scroller" id="scroller">
          <ul class="list" id="results" role="listbox" aria-label="Words"></ul>
        </div>
      </div>

      <article class="entry" id="entry" hidden>
        <h2 class="entry-word" id="entry-word"></h2>
        <p class="entry-forms" id="entry-forms"></p>
        <div class="entry-body" id="entry-body"></div>
        <p class="entry-note" id="entry-note" hidden></p>
        <a class="entry-link" id="entry-link" target="_blank" rel="noopener">Read the entry on Wiktionary</a>
      </article>

      <footer class="credit">
        Words from <a href="https://en.wiktionary.org">Wiktionary</a>,
        <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a> ·
        <a href="https://github.com/smitravitz/Dictionarius">Source code</a>, GPL-3.0
      </footer>
    </main>

    <dialog class="settings" id="settings" aria-labelledby="settings-title">
      <form method="dialog">
        <h2 class="settings-title" id="settings-title">Settings</h2>
        <!-- A switch per filter in src/filters.ts (labels and help text live there). -->
        <div id="switches"></div>
        <button class="settings-done" value="done">Done</button>
      </form>
    </dialog>
    <!-- The peek: a held word's first meanings (web/peek.ts). -->
    <div class="peek" id="peek" hidden aria-live="polite"></div>
    <dialog class="settings" id="filters" aria-labelledby="filters-title">
      <form method="dialog">
        <h2 class="settings-title" id="filters-title">Filters</h2>
        <!-- A pair of wheels per range filter in src/filters.ts. -->
        <div id="ranges"></div>
        <button class="settings-done" value="done">Done</button>
      </form>
    </dialog>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
